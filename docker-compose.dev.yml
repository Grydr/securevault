services:
  postgres:
    image: postgres:15-alpine
    container_name: encryption_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: encryption_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d encryption_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./encryption-web-backend
      dockerfile: Dockerfile.dev
    container_name: encryption_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_TYPE: postgres
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/encryption_db?sslmode=disable
      JWT_SECRET: super-secure-cryptavault-jwt-secret-2026-assignment-1
      UPLOADS_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
      - ./encryption-web-backend:/app:z

  frontend:
    image: localhost/encryption-web_frontend:dev
    build:
      context: ./encryption-web-frontend
      dockerfile: Dockerfile.dev
    container_name: encryption_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:8080
    ports:
      - "3000:5173"
      - "5173:5173"
    volumes:
      # Live-mount frontend code so edits instantly reload in browser
      - ./encryption-web-frontend:/app:z
      # Anonymous volume preserves container's installed node_modules
      - /app/node_modules

volumes:
  pgdata:
  uploads_data:
