services:
  postgres:
    image: postgres:15-alpine
    container_name: encryption_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: encryption_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d encryption_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  backend:
    build:
      context: ./encryption-web-backend
      dockerfile: Dockerfile
    container_name: encryption_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_TYPE: postgres
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/encryption_db?sslmode=disable
      JWT_SECRET: super-secure-cryptavault-jwt-secret-2026-assignment-1
      UPLOADS_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    # Memory allocation guidance for 500MB video buffering:
    # Processing and encrypting/decrypting 500MB multimedia payloads in Go requires buffering:
    # 1. Incoming plaintext payload: ~500MB in RAM
    # 2. Multi-cipher ciphertext buffers (AES-256-CBC, RC4-128, DES-CBC): ~3 x 500MB = 1.5GB
    # 3. Go GC headroom, multipart form allocations, and disk buffers: ~500MB - 1GB
    # Peak memory can reach ~2.5GB - 3.5GB under concurrent uploads.
    # Recommended minimum host memory: 4GB+. Container memory limit: 4096MB.
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 1024M

  frontend:
    build:
      context: ./encryption-web-frontend
      dockerfile: Dockerfile
    container_name: encryption_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
      - "5173:80"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  pgdata:
  uploads_data:
